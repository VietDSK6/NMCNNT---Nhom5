global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mini-paas-runner
    metrics_path: /metrics
    static_configs:
      - targets:
          - runner:3001
        labels:
          environment: development
