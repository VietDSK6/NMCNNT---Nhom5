worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request_method $request_uri $status '
                    '$body_bytes_sent "$http_user_agent" $request_time';
    access_log /dev/stdout main;
    error_log /dev/stderr notice;

    sendfile on;
    keepalive_timeout 30;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    upstream app_a {
        zone app_a 64k;
        server app-a:3000 resolve;
        keepalive 8;
    }

    upstream app_b {
        zone app_b 64k;
        server app-b:3000 resolve;
        keepalive 8;
    }

    upstream dashboard {
        zone dashboard 64k;
        server dashboard:8080 resolve;
        keepalive 8;
    }

    upstream control_api {
        zone control_api 64k;
        server control-api:3000 resolve;
        keepalive 8;
    }

    upstream grafana {
        zone grafana 64k;
        server grafana:3000 resolve;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location /api/ {
            proxy_pass http://control_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /monitoring {
            return 308 /monitoring/;
        }

        location /monitoring/ {
            proxy_pass http://grafana;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /monitoring;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 30s;
        }

        location = /apps/app-a {
            return 308 /apps/app-a/;
        }

        location /apps/app-a/ {
            proxy_pass http://app_a/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /apps/app-a;
        }

        location = /apps/app-b {
            return 308 /apps/app-b/;
        }

        location /apps/app-b/ {
            proxy_pass http://app_b/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /apps/app-b;
        }

        location / {
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
