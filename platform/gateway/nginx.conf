worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request_method $request_uri $status '
                    '$body_bytes_sent "$http_user_agent" $request_time';
    access_log /dev/stdout main;
    error_log /dev/stderr notice;

    sendfile on;
    keepalive_timeout 30;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    upstream app_a {
        server app-a:3000;
        keepalive 8;
    }

    upstream app_b {
        server app-b:3000;
        keepalive 8;
    }

    server {
        listen 8080;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway"}';
        }

        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location = /apps/app-a {
            return 308 /apps/app-a/;
        }

        location /apps/app-a/ {
            proxy_pass http://app_a/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /apps/app-a;
        }

        location = /apps/app-b {
            return 308 /apps/app-b/;
        }

        location /apps/app-b/ {
            proxy_pass http://app_b/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /apps/app-b;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not_found"}';
        }
    }
}
