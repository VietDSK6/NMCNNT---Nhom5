name: mini-paas

services:
  gateway:
    build:
      context: ./platform/gateway
    image: mini-paas/gateway:p0.1
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy
    networks:
      - edge
      - control
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  app-a:
    build:
      context: ./apps/app-a
      args:
        APP_VERSION: ${APP_A_VERSION:-v1.0.0}
    image: mini-paas/app-a:${APP_A_VERSION:-v1.0.0}
    expose:
      - "3000"
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    cpus: 0.35
    mem_limit: 128m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  app-b:
    build:
      context: ./apps/app-b
      args:
        APP_VERSION: ${APP_B_VERSION:-v1.0.0}
    image: mini-paas/app-b:${APP_B_VERSION:-v1.0.0}
    expose:
      - "3000"
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    cpus: 0.35
    mem_limit: 128m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

networks:
  edge:
    name: mini-paas-edge
    driver: bridge
  control:
    name: mini-paas-control
    driver: bridge
    internal: true
