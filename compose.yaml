name: mini-paas

services:
  gateway:
    build:
      context: ./platform/gateway
    image: mini-paas/gateway:p1-observability
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      control-api:
        condition: service_healthy
      grafana:
        condition: service_healthy
    networks:
      - edge
      - control
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  dashboard:
    build:
      context: ./platform/dashboard
    image: mini-paas/dashboard:p1-dashboard-navigation
    expose:
      - "8080"
    networks:
      - control
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    cpus: 0.20
    mem_limit: 64m
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  control-api:
    build:
      context: ./platform/control-api
    image: mini-paas/control-api:p1-observability
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/control.db
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Hãy tạo file .env và đặt ADMIN_PASSWORD}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:8080}
      GATEWAY_BASE_URL: http://gateway:8080
      RUNNER_BASE_URL: http://runner:3001
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:?Hãy tạo file .env và đặt RUNNER_SHARED_SECRET}
      ENVIRONMENT_ENCRYPTION_KEY: ${ENVIRONMENT_ENCRYPTION_KEY:-}
      APP_A_VERSION: ${APP_A_VERSION:-v1.0.0}
      APP_B_VERSION: ${APP_B_VERSION:-v1.0.0}
    depends_on:
      runner:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - control
    volumes:
      - control-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    cpus: 0.35
    mem_limit: 192m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  runner:
    build:
      context: ./platform/runner
    image: mini-paas/deployment-runner:p1-observability
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DOCKER_SOCKET: /var/run/docker.sock
      COMPOSE_PROJECT_NAME: mini-paas
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:?Hãy tạo file .env và đặt RUNNER_SHARED_SECRET}
    expose:
      - "3001"
    networks:
      - control
      - source-egress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    cpus: 0.25
    mem_limit: 96m
    pids_limit: 75
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=256MB
    depends_on:
      runner:
        condition: service_healthy
    expose:
      - "9090"
    networks:
      - control
    volumes:
      - ./platform/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./platform/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    cpus: 0.30
    mem_limit: 320m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    environment:
      GF_SERVER_ROOT_URL: ${PUBLIC_ORIGIN:-http://127.0.0.1:8080}/monitoring/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${ADMIN_USERNAME:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-${ADMIN_PASSWORD:?Hãy tạo file .env và đặt ADMIN_PASSWORD}}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    depends_on:
      prometheus:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - control
    volumes:
      - ./platform/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./platform/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    cpus: 0.35
    mem_limit: 384m
    pids_limit: 300
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  app-a:
    build:
      context: ./apps/app-a
      args:
        APP_VERSION: ${APP_A_VERSION:-v1.0.0}
    image: mini-paas/app-a:${APP_A_VERSION:-v1.0.0}
    labels:
      io.mini-paas.managed: "true"
      io.mini-paas.app-id: app-a
      io.mini-paas.environment-keys: ""
    expose:
      - "3000"
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    cpus: 0.35
    mem_limit: 128m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  app-b:
    build:
      context: ./apps/app-b
      args:
        APP_VERSION: ${APP_B_VERSION:-v1.0.0}
    image: mini-paas/app-b:${APP_B_VERSION:-v1.0.0}
    labels:
      io.mini-paas.managed: "true"
      io.mini-paas.app-id: app-b
      io.mini-paas.environment-keys: ""
    expose:
      - "3000"
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    cpus: 0.35
    mem_limit: 128m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

networks:
  edge:
    name: mini-paas-edge
    driver: bridge
  control:
    name: mini-paas-control
    driver: bridge
    internal: true
  source-egress:
    name: mini-paas-source-egress
    driver: bridge

volumes:
  control-data:
    name: mini-paas-control-data
  prometheus-data:
    name: mini-paas-prometheus-data
  grafana-data:
    name: mini-paas-grafana-data
